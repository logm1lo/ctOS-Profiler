name: ctos
description: A unofficial Watch Dogs ctOS face recognition app reimagined.
version: 1.0.1+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5
  face_detection_tflite: ^5.0.13
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9
  image: ^4.1.3
  image_picker: ^1.0.7
  path: ^1.8.3
  file_picker: ^8.0.0
  shared_preferences: ^2.5.5
  http: ^1.2.0
  url_launcher: ^6.2.4
  permission_handler: ^11.3.1
  flutter_nfc_kit: ^3.4.2
  flutter_blue_plus: ^1.31.15
  network_info_plus: ^6.0.0
  shelf: ^1.4.1
  shelf_router: ^1.1.4
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.1
  battery_plus: ^7.0.0
  geolocator: ^14.0.2
  flutter_lints: 3.0.0
  lints: 3.0.0
  cellular_info: 1.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/models/facenet.tflite
    - assets/models/mobile_face_net.tflite
